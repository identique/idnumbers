[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idnumbers"
dynamic = ["version"]
description = "id numbers verification toolkits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Identique", email = "microdataxyz@outlook.com"}]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Identique/idnumbers"
Source = "https://github.com/Identique/idnumbers"
Tracker = "https://github.com/Identique/idnumbers/issues"

[tool.setuptools]
data-files = {"version" = ["VERSION"]}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
# Same discovery as setuptools.find_packages(): only directories with __init__.py.
namespaces = false
exclude = ["*tests*"]

[tool.setuptools.package-data]
idnumbers = ["py.typed"]
