[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idnumbers"
dynamic = ["version"]
description = "id numbers verification toolkits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Identique", email = "microdataxyz@outlook.com"}]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Identique/idnumbers"
Source = "https://github.com/Identique/idnumbers"
Tracker = "https://github.com/Identique/idnumbers/issues"

[tool.setuptools]
data-files = {"version" = ["VERSION"]}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
# Same discovery as setuptools.find_packages(): only directories with __init__.py.
namespaces = false
exclude = ["*tests*"]

[tool.setuptools.package-data]
idnumbers = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["idnumbers", "tests/typing/parse_api_consumer.py"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pycodestyle E4/E7/E9 and pyflakes, ruff's long-standing defaults; pinned since newer releases select more.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["idnumbers"]

[tool.coverage.report]
# The measured line-and-branch coverage when the floor was set (#326) was 97.54%.
fail_under = 97
precision = 2
show_missing = true
skip_covered = true
