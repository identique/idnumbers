name: apidoc

# Build the development docs on main; manual runs may rebuild a selected stable release.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version value'
        type: string
        required: false
        default: ''
      source-ref:
        description: 'Optional matching version tag to build instead of the caller commit'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Version value'
        type: string
        required: false
        default: ''
      source-ref:
        description: 'Optional matching version tag to build instead of the caller commit'
        type: string
        required: false
        default: ''

# Security: restrict permissions for CI jobs.
permissions:
  contents: write
  pages: write

jobs:
  build_deploy:
    runs-on: ubuntu-24.04
    # One deploy per group at a time, never cancelled: dev builds share a group, so back-to-back pushes to main queue
    # and the newest pending run replaces an older pending one. A release has its own group per version, so a dev
    # build never cancels or replaces it.
    concurrency:
      group: apidoc-${{ inputs.version || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install pydoctor==22.9.1
      - name: build selected source and stage deploy helper
        run: python tools/docs_rebuild.py prepare
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          IDNUMBERS_DOCS_VERSION: ${{ inputs.version || '' }}
          IDNUMBERS_DOCS_SOURCE_REF: ${{ inputs.source-ref || '' }}
          IDNUMBERS_DOCS_CALLER_SHA: ${{ github.sha }}
      - name: deploy docs and merge current gh-pages history
        run: python "$RUNNER_TEMP/idnumbers-docs-orchestrator/docs_rebuild.py" deploy
