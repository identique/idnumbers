name: apidoc

# build the documentation whenever there are new commits on main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version value'
  workflow_call:
    inputs:
      version:
        description: 'Version value'
        type: string

# security: restrict permissions for CI jobs.
permissions:
  contents: write
  pages: write

jobs:
  # Build and Deploy the documentation and upload the static HTML files as an artifact.
  build_deploy:
    runs-on: ubuntu-24.04
    # One deploy per group at a time, never cancelled: dev builds share a group, so back-to-back pushes to main queue
    # and the newest pending run replaces an older pending one. A release has its own group per version, so a dev
    # build never cancels or replaces it.
    concurrency:
      group: apidoc-${{ inputs.version || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install pydoctor==22.9.1
      - name: build dev build
        if: inputs.version == ''
        run: |
          pydoctor --docformat=restructuredtext --make-html --html-output=pydocs/dev --project-name="idnumbers" --project-version=dev --project-url=https://github.com/identique/idnumbers --template-dir=./docs/template idnumbers
          echo "window._CURRENT_VERSION = 'dev';" > pydocs/dev/current_version.js
      - name: build prod build
        if: inputs.version != ''
        run: |
          pydoctor --docformat=restructuredtext --make-html --html-output=pydocs/v${{ inputs.version }} --project-name="idnumbers" --project-version=${{ inputs.version }} --project-url=https://github.com/identique/idnumbers --template-dir=./docs/template idnumbers
          echo "window._CURRENT_VERSION = '${{ inputs.version }}';" > pydocs/v${{ inputs.version }}/current_version.js
      - name: prepare for deploy
        run: |
          cp docs/template/versions.js pydocs/
          ls pydocs/
          git checkout origin/gh-pages -b gh-pages
          git config --local user.email "microdataxyz@outlook.com"
          git config --local user.name "Microdata Bot"
      - name: deploy dev apidoc
        if: inputs.version == ''
        run: |
          cp -rf pydocs/* ./docs
          git add ./docs
          git diff-index --quiet HEAD || git commit -m "Update dev doc"
      - name: deploy prod apidoc
        if: inputs.version != ''
        run: |
          ls pydocs
          rm -rf ./docs/v${{ inputs.version }}
          cp -rf pydocs/v${{ inputs.version }} ./docs/v${{ inputs.version }}
          cp pydocs/versions.js ./docs/versions.js
          git add ./docs
          git diff-index --quiet HEAD || git commit -m "Add release doc v${{ inputs.version }}"
      # A deploy in the other group may have pushed gh-pages first: rebase this run's docs commit onto it and push
      # again. A rebase conflict fails the job instead of overwriting the other deploy.
      - name: push gh-pages
        run: |
          for attempt in 1 2 3; do
            git push origin gh-pages && exit 0
            echo "gh-pages moved on the remote (attempt $attempt); rebasing the docs commit"
            git pull --rebase origin gh-pages
          done
          git push origin gh-pages
