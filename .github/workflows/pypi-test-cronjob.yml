name: PyPI install test with uv

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PyPI release version (blank checks latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  pypi-install:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.1'
          enable-cache: false
      - name: Install and check the PyPI package outside the checkout
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/idnumbers-pypi-env"
          scratch=$(mktemp -d "$RUNNER_TEMP/idnumbers-pypi-smoke.XXXXXX")
          uv venv --python "${{ matrix.python-version }}" "$environment"
          requirement='idnumbers'
          if [ -n "$VERSION" ]; then
            requirement="idnumbers==$VERSION"
          fi
          uv pip install --python "$environment/bin/python" --index-url https://pypi.org/simple "$requirement"
          cp tests/pypi_spec.py tests/uv_install_spec.py docs/examples/uv_script.py README.md "$scratch/"
          version="$VERSION"
          if [ -z "$version" ]; then
            version=$("$environment/bin/python" -I \
              -c 'from importlib.metadata import version; print(version("idnumbers"))')
          fi
          cd "$scratch"
          "$environment/bin/python" -I uv_install_spec.py --version "$version" \
            --readme README.md --example uv_script.py
          "$environment/bin/python" -I pypi_spec.py
