# This workflow runs the unit tests on every supported version of Python, then type-checks the package with mypy,
# lints it with ruff, enforces the coverage floor, prints informational benchmarks, and finishes with a single
# ci-summary result that fails unless every other job succeeded.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Unit Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    # Pinned (not ubuntu-latest) so Python 3.9 stays installable; revisit when 3.9 is dropped.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with python test
      run: |
        python -m unittest

  typecheck:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # mypy 2.x cannot target Python 3.9; 1.20.2 is the newest release that can.
    - name: Install mypy
      run: python -m pip install mypy==1.20.2
    - name: Type-check with mypy (strict, Python 3.9 target; config in pyproject.toml)
      run: python -m mypy

  lint:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install ruff
      run: python -m pip install ruff==0.16.10
    - name: Lint with ruff (rules in pyproject.toml)
      run: ruff check --output-format=github .

  coverage:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install coverage
      run: python -m pip install coverage==7.16.2
    - name: Run the unit tests under coverage
      run: python -m coverage run -m unittest
    - name: Report coverage (fails below fail_under in pyproject.toml)
      shell: bash
      run: python -m coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"

  bench:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # Informational: timings never fail the job, only a crash or a vector that no longer validates does.
    - name: Run the benchmarks
      shell: bash
      run: python bench/run.py | tee -a "$GITHUB_STEP_SUMMARY"

  ci-summary:
    # One result to mark as required in branch protection: fails unless every job above succeeded.
    if: always()
    needs: [build, typecheck, lint, coverage, bench]

    runs-on: ubuntu-24.04

    steps:
    - name: Fail unless every job succeeded
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
    - name: All jobs succeeded
      run: echo "build, typecheck, lint, coverage and bench all succeeded"
