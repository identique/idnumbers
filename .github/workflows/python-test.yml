# This workflow will install Python dependencies, run the unit tests on every supported version of Python and
# type-check the package with mypy
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Unit Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    # Pinned (not ubuntu-latest) so Python 3.9 stays installable; revisit when 3.9 is dropped.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with python test
      run: |
        python -m unittest

  typecheck:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    # mypy 2.x cannot target Python 3.9; 1.20.2 is the newest release that can.
    - name: Install mypy
      run: python -m pip install mypy==1.20.2
    - name: Type-check with mypy (strict, Python 3.9 target; config in pyproject.toml)
      run: python -m mypy
