name: Official Release
on:
  workflow_dispatch:
    inputs:
      to-prod:
        default: "no"
        description: "Type yes for pypi.org; otherwise publish to test.pypi.org"
        required: true
      trusted-publishing:
        type: boolean
        default: false
        description: "Production only: enable AFTER maintainer configures the PyPI publisher"
      expected-version:
        type: string
        default: ""
        description: "Recommended: expected stable X.Y.Z version (must match VERSION)"

permissions:
  contents: read

# Never cancel an upload, or allow concurrent publication of this project.
concurrency:
  group: idnumbers-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.guard.outputs.version }}
    env:
      TO_PROD: ${{ inputs.to-prod }}
      TRUSTED_PUBLISHING: ${{ inputs.trusted-publishing }}
      EXPECTED_VERSION: ${{ inputs.expected-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
      - name: Guard approved release inputs
        id: guard
        run: python -m tools.check_release
      - name: Build and check distributions
        run: |
          uv build
          uvx --from twine==7.0.0 twine check --strict dist/*
          python -m tools.check_release --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  publish-token:
    needs: build
    if: inputs.to-prod == 'yes' && !inputs.trusted-publishing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  publish-trusted:
    needs: build
    if: inputs.to-prod == 'yes' && inputs.trusted-publishing
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/idnumbers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  publish-test:
    needs: build
    if: inputs.to-prod != 'yes' && !inputs.trusted-publishing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          attestations: false

  call-docs:
    needs: [build, publish-token, publish-trusted]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (needs.publish-token.result == 'success' || needs.publish-trusted.result == 'success')
    permissions:
      contents: write
      pages: write
    uses: identique/idnumbers/.github/workflows/docs.yml@main
    with:
      version: ${{ needs.build.outputs.version }}
